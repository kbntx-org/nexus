apiVersion: v1
kind: Service
metadata:
  name: traefik-api-service
  labels:
    external-dns/enabled: "true"
  annotations:
    external-dns.kubernetes.io/internal-hostname: {{ .Values.dashboardHost }}
spec:
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - port: 8080
      name: traefik
