ingressHost: registry.kbntx.com
internalIngressTarget: 10.43.216.131

certificate:
  enabled: true

zot:
  replicaCount: 1
  strategy:
    type: Recreate

  service:
    type: ClusterIP

  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: zot-secret
          key: s3AccessKeyId
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: zot-secret
          key: s3SecretAccessKey

  mountConfig: true
  configFiles:
    config.json: |-
      {
        "storage": {
          "rootDirectory": "/var/lib/registry",
          "gc": true,
          "gcDelay": "1h",
          "gcInterval": "24h",
          "dedupe": false,
          "storageDriver": {
            "name": "s3",
            "rootdirectory": "/registry",
            "region": "eeur",
            "bucket": "nexus-registry",
            "regionendpoint": "https://2bde0126da63a3a9c94029d14ea380db.eu.r2.cloudflarestorage.com",
            "forcepathstyle": true,
            "secure": true
          }
        },
        "http": {
          "address": "0.0.0.0",
          "port": "5000",
          "compat": ["docker2s2"]
        },
        "log": { "level": "info" },
        "extensions": {
          "search": { "enable": true },
          "ui": { "enable": true },
          "sync": {
            "enable": true,
            "downloadDir": "/tmp/zot-sync",
            "registries": [
              {
                "urls": ["https://index.docker.io"],
                "onDemand": true,
                "tlsVerify": true,
                "content": [{ "prefix": "**", "destination": "/dockerhub" }]
              },
              {
                "urls": ["https://ghcr.io"],
                "onDemand": true,
                "tlsVerify": true,
                "content": [{ "prefix": "**", "destination": "/ghcr" }]
              }
            ]
          }
        }
      }
